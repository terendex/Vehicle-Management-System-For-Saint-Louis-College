services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB:       plate_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: password
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  postgres_data: